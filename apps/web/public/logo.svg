<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#141E2E"/>
      <stop offset="100%" style="stop-color:#1E2D42"/>
    </linearGradient>

    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F0F2F5"/>
      <stop offset="100%" style="stop-color:#9AA5B8"/>
    </linearGradient>

    <linearGradient id="upperGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E8523A"/>
      <stop offset="100%" style="stop-color:#F07850"/>
    </linearGradient>

    <linearGradient id="lowerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2BB8B8"/>
      <stop offset="100%" style="stop-color:#2896D4"/>
    </linearGradient>

    <!-- Dot — refined, no yolk feel -->
    <radialGradient id="dotGrad" cx="38%" cy="35%" r="60%">
      <stop offset="0%" style="stop-color:#FFFFFF" stop-opacity="0.95"/>
      <stop offset="40%" style="stop-color:#F5F5F5" stop-opacity="0.9"/>
      <stop offset="100%" style="stop-color:#C8CDD6" stop-opacity="1"/>
    </radialGradient>

    <filter id="shadow" x="-8%" y="-6%" width="116%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="22" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="armGlow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dotShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Rounded square clip (app icon shape) -->
    <clipPath id="iconClip">
      <rect x="10" y="10" width="380" height="380" rx="88" ry="88"/>
    </clipPath>
  </defs>

  <!-- App icon shape background -->
  <rect x="10" y="10" width="380" height="380" rx="88" ry="88"
        fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Subtle noise/depth — top light -->
  <rect x="10" y="10" width="380" height="190" rx="88" ry="88"
        fill="white" opacity="0.025" clip-path="url(#iconClip)"/>

  <!-- Very subtle color glows in background -->
  <circle cx="295" cy="120" r="100" fill="#E8523A" opacity="0.05" clip-path="url(#iconClip)"/>
  <circle cx="110" cy="285" r="90" fill="#2BB8B8" opacity="0.06" clip-path="url(#iconClip)"/>

  <!-- ══════════════ K ══════════════ -->

  <!-- Stem — clean white/grey pill -->
  <rect x="124" y="110" width="31" height="180" rx="15.5"
        fill="url(#stemGrad)" clip-path="url(#iconClip)"/>

  <!-- Upper arm — coral -->
  <path d="M 149 194 L 272 110"
        stroke="url(#upperGrad)"
        stroke-width="29"
        stroke-linecap="round"
        fill="none"
        filter="url(#armGlow)"
        clip-path="url(#iconClip)"/>

  <!-- Lower arm — teal -->
  <path d="M 149 206 L 272 290"
        stroke="url(#lowerGrad)"
        stroke-width="29"
        stroke-linecap="round"
        fill="none"
        filter="url(#armGlow)"
        clip-path="url(#iconClip)"/>

  <!-- Junction dot — clean white sphere, professional -->
  <circle cx="149" cy="200" r="18"
        fill="url(#dotGrad)"
        filter="url(#dotShadow)"/>

  <!-- Dot inner gleam -->
  <circle cx="144" cy="194" r="5.5" fill="white" opacity="0.6"/>

  <!-- ══════════════ BOTTOM ACCENT ══════════════ -->
  <!-- Three micro dots — subtle, like indicator lights -->
  <circle cx="174" cy="336" r="4" fill="#E8523A" opacity="0.65"/>
  <circle cx="190" cy="336" r="4" fill="white" opacity="0.25"/>
  <circle cx="206" cy="336" r="4" fill="#2BB8B8" opacity="0.65"/>

  <!-- Outer border subtle highlight -->
  <rect x="10" y="10" width="380" height="380" rx="88" ry="88"
        fill="none"
        stroke="rgba(255,255,255,0.07)"
        stroke-width="1.5"/>

</svg>
